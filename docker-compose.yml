services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: synthmr
      POSTGRES_PASSWORD: synthmr
      POSTGRES_DB: synthmr
    ports:
      - "5433:5432"   # host 5433 to avoid conflict with local Postgres on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthmr -d synthmr"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
